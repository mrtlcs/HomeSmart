name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Frontend & Package Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Compile Frontend Bundle
        working-directory: frontend
        run: npm run build

      # HACS (zip_release) extracts this archive straight into custom_components/homesmart.
      - name: Archive Integration Release
        run: |
          cd custom_components/homesmart
          zip -r ../../homesmart.zip . -x "__pycache__/*" "*.pyc"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            homesmart.zip
            custom_components/homesmart/frontend/homesmart-panel.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
